services:
  go-secure-labs:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/Dockerfile
    container_name: go-secure-labs
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - HTTP_ADDR=${HTTP_ADDR}
      - HTTP_PORT=${HTTP_PORT}
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=${LOGGER_FOLDER}
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    restart: always
    depends_on:
      - postgres

  postgres:
    image: postgres:18.4-bookworm
    container_name: go-secure-labs-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always

  postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    container_name: go-secure-labs-postgres-migrate
    depends_on:
      - postgres

  semgrep:
    image: semgrep/semgrep:1.137.0
    container_name: go-secure-labs-semgrep
    volumes:
      - ${PROJECT_ROOT}:/src
    working_dir: /src
    
